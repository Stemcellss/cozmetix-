    function LiveCameraCapture({ onCapture, lang = "tr" }) {
      const tr = lang === "tr";
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const [cameraActive, setCameraActive] = useState(false);
      const [cameraError, setCameraError] = useState(null);

      const startCamera = async () => {
        setCameraError(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1080 } },
            audio: false,
          });
          streamRef.current = stream;
          setCameraActive(true);
          setTimeout(() => {
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play().catch(() => {});
            }
          }, 60);
        } catch {
          setCameraError(
            tr
              ? "Kamera izni kapalı. '⚡ Hızlı Demo Analiz' butonunu kullanabilirsiniz."
              : "Camera permission denied. Use 'Instant Demo Scan'."
          );
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach((t) => t.stop());
          streamRef.current = null;
        }
        setCameraActive(false);
      };

      useEffect(() => () => stopCamera(), []);

      const captureFrame = () => {
        stopCamera();
        onCapture(null);
      };

      return (
        <div>
          {!cameraActive ? (
            <div>
              <div
                onClick={startCamera}
                className="cursor-pointer mx-auto w-52 h-52 rounded-full border-2 border-dashed flex flex-col items-center justify-center mb-5 transition hover:bg-black/5"
                style={{ borderColor: C.accent }}
              >

                <span className="text-[11px] font-medium px-4" style={{ color: C.ink }}>

                <div className="text-xs p-3 rounded-xl mb-4" style={{ background: "#FDECEC", color: C.accent }}>
                  {cameraError}
                </div>
              )}
              <div className="grid grid-cols-2 gap-2">
                <button onClick={startCamera} className="py-3 rounded-full text-xs font-medium" style={{ background: C.ink, color: "#FFFDF9" }}>
                  {tr ? "📷 Kamera Aç" : "📷 Camera"}
                </button>
                <button onClick={() => onCapture(null)} className="py-3 rounded-full text-xs font-medium" style={{ background: C.accent, color: "#fff" }}>
                  {tr ? "⚡ Hızlı Demo Analiz" : "⚡ Instant Demo Scan"}
                </button>

                      Cildimi Analiz Et

                    <button onClick={() => setPage("products")} className="px-6 py-3 rounded-full text-sm font-semibold" style={{ background: C.accent, color: "#FFFDF9" }}>
                      🛍️ Ürünleri & Mağazaları Gör
                    </button>
                  </div>
                </div>

                {/* Ana Sayfada Öne Çıkan Ürünler ve Doğrudan Mağaza Butonları */}
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-2xl font-serif font-bold">Popüler Dermokozmetikler (Trendyol · Sephora · Amazon)</h2>
                  <button onClick={() => setPage("products")} className="text-xs underline font-semibold" style={{ color: C.accent }}>
                    Tümünü Gör →
                  </button>
                </div>
                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {products.slice(0, 3).map((p) => (
                    <ProductCard key={p.id} p={p} onOpen={setDetail} onMerchantClick={handleMerchantClick} />
                  ))}
                </div>
              </div>
            )}

            {/* ADMIN & AFFILIATE KOMİSYON TAKİBİ (TRENDYOL / SEPHORA / AMAZON SABİT KARTLARIYLA) */}
            {page === "admin" && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="rounded-3xl p-6" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-5">
                    <div>
                      <div className="text-[10px] uppercase tracking-widest mb-1" style={{ color: C.accent }}>
                        AFFILIATE NETWORK DASHBOARD
                      </div>
                      <h2 className="text-2xl font-serif font-bold">Admin & Affiliate Komisyon Takibi</h2>
                    </div>
                    <button
                      onClick={() => setPage("products")}
                      className="px-4 py-2 rounded-full text-xs font-semibold"
                      style={{ background: C.ink, color: "#FFFDF9" }}
                    >
                      🛍️ Ürünlere Git & Test Tıklaması Yap
                    </button>
                  </div>

                  {/* 3 Büyük Mağaza Kartı: Trendyol, Sephora, Amazon */}
                  <div className="grid sm:grid-cols-3 gap-3 mb-6">
                    {Object.values(MERCHANTS).map((m) => (
                      <div key={m.id} className="rounded-2xl p-4" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
                        <div className="flex items-center justify-between mb-2">
                          <span className="px-3 py-1 rounded-full text-xs font-bold text-white" style={{ background: m.badgeColor }}>
                            {m.name}
                          </span>
                          <span className="text-xs font-semibold" style={{ color: C.accent2 }}>{m.rateLabel}</span>
                        </div>
                        <div className="text-2xl font-serif font-bold my-1">
                          {countByStore[m.id]} <span className="text-xs font-sans font-normal" style={{ color: C.muted }}>Tıklama</span>
                        </div>
                        <div className="text-[11px] truncate" style={{ color: C.muted }}>
                          Partner ID: <code>{m.partnerId}</code>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Toplam Özet Barı */}
                  <div className="rounded-2xl p-4 mb-5 flex flex-wrap items-center justify-between gap-3" style={{ background: C.ink, color: "#FFFDF9" }}>
                    <div>
                      <div className="text-[10px] uppercase tracking-widest" style={{ color: C.gold }}>Toplam Mağaza Tıklaması</div>
                      <div className="text-2xl font-serif font-bold">{affiliateClicks.length}</div>
                    </div>
                    <div>
                      <div className="text-[10px] uppercase tracking-widest" style={{ color: C.gold }}>Kazanılan Affiliate Komisyonu</div>
                      <div className="text-2xl font-serif font-bold" style={{ color: "#A8E6CF" }}>${totalCommission}</div>
                    </div>
                    <button
                      onClick={() => {
                        handleMerchantClick(products[0], "trendyol");
                      }}
                      className="px-4 py-2 rounded-full text-xs font-semibold"
                      style={{ background: "#F27A1A", color: "#fff" }}
                    >
                      + Örnek Trendyol Tıklaması Test Et
                    </button>
                  </div>

                  {/* Canlı Tıklama Listesi */}
                  <div className="text-xs font-semibold mb-2" style={{ color: C.muted }}>
                    Son Mağaza Yönlendirmeleri (Trendyol · Sephora · Amazon)
                  </div>
                  <div className="space-y-2">
                    {affiliateClicks.map((c) => (
                      <div key={c.id} className="flex items-center justify-between text-xs p-3 rounded-xl" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
                        <div>
                          <span
                            className="inline-block px-2 py-0.5 rounded text-[10px] font-bold text-white mr-2"
                            style={{ background: MERCHANTS[c.merchantKey]?.badgeColor || C.ink }}
                          >
                            {c.merchant}
                          </span>
                          <strong>{c.brand}</strong> — {c.name}
                        </div>
                        <div className="flex items-center gap-3 shrink-0">
                          <span className="text-[10px]" style={{ color: C.muted }}>{c.time}</span>
                          <strong style={{ color: C.accent2 }}>+${c.commission}</strong>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ÜRÜNLER, INCI OCR VE ÇAKIŞMA KONTROLÜ */}
            {page === "products" && (
              <div className="space-y-6">
                <div className="rounded-3xl p-6" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                  <h3 className="text-xl font-serif font-bold mb-2">Ürün Arkası İçindekiler (INCI) Tarayıcı</h3>
                  <div className="flex flex-col sm:flex-row gap-2 mb-3">
                    <input
                      value={inciInput}
                      onChange={(e) => setInciInput(e.target.value)}
                      className="flex-1 px-4 py-2.5 rounded-xl text-xs"
                      style={{ background: C.bg, border: `1px solid ${C.line}` }}
                    />
                    <button
                      onClick={() => {
                        const hasBad = inciInput.toLowerCase().includes("alcohol") || inciInput.toLowerCase().includes("parfum");
                        setInciScore(hasBad ? 58 : 95);
                        notify("INCI analizi güncellendi!");
                      }}
                      className="px-5 py-2.5 rounded-full text-xs font-semibold"
                      style={{ background: C.ink, color: "#FFFDF9" }}
                    >
                      INCI Analiz Et
                    </button>
                  </div>
                  <div className="text-xs font-semibold" style={{ color: inciScore >= 80 ? C.accent2 : C.accent }}>
                    Cozmetix Match Score: %{inciScore}
                  </div>
                </div>

                <div className="rounded-3xl p-6" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                  <h3 className="text-xl font-serif font-bold mb-3">İçerik Çakışma Denetleyicisi</h3>
                  <div className="grid sm:grid-cols-2 gap-3 mb-3">
                    <select value={compA} onChange={(e) => setCompA(Number(e.target.value))} className="p-2.5 rounded-xl text-xs" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
                      {products.map((p) => <option key={p.id} value={p.id}>{p.brand} — {p.name}</option>)}
                    </select>
                    <select value={compB} onChange={(e) => setCompB(Number(e.target.value))} className="p-2.5 rounded-xl text-xs" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
                      {products.map((p) => <option key={p.id} value={p.id}>{p.brand} — {p.name}</option>)}
                    </select>
                  </div>
                  <div className="p-3.5 rounded-xl text-xs" style={{ background: C.bg }}>
                    <strong style={{ color: isConflict ? C.accent : C.accent2 }}>
                      {isConflict ? "✕ Çakışma Uyarısı (BHA + Retinol): " : "✓ Güvenli Sinerji: "}
                    </strong>
                    {isConflict
                      ? "Aynı akşam üst üste uygulamayın; farklı gecelerde dönüşümlü kullanın."
                      : "Aynı rutinde güvenle birlikte uygulanabilir."}
                  </div>
                </div>

                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {products.map((p) => (
                    <ProductCard key={p.id} p={p} onOpen={setDetail} onMerchantClick={handleMerchantClick} />
                  ))}
                </div>
              </div>
            )}

            {/* ANALİZ */}
            {page === "analyze" && (
              <div className="max-w-lg mx-auto rounded-3xl p-8 text-center" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                <h2 className="text-2xl font-serif font-bold mb-2">Canlı Kamera & Işık Kontrolü</h2>
                <p className="text-xs mb-6" style={{ color: C.muted }}>
                  Yüzünüzü çerçeveye hizalayın veya hızlı demoyu başlatın
                </p>
                <LiveCameraCapture
                  lang={lang}
                  onCapture={() => {
                    notify("✓ Cilt analizi tamamlandı!");
                    setPage("results");
                  }}
                />
              </div>
            )}

            {/* PROFİL SONUÇLARI */}
            {page === "results" && (
              <div className="max-w-4xl mx-auto">
                <h2 className="text-3xl font-serif font-bold text-center mb-6">Combination Skin Profile</h2>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-8">
                  {INITIAL_SKIN_METRICS.map((m) => (
                    <Metric key={m.key} label={m.key} value={m.value} focus={m.focus} />
                  ))}
                </div>
                <div className="grid sm:grid-cols-3 gap-4">
                  {products.slice(0, 3).map((p) => (
                    <ProductCard key={p.id} p={p} onOpen={setDetail} onMerchantClick={handleMerchantClick} />
                  ))}
                </div>
              </div>
            )}

            {/* CİLDİM */}
            {page === "myskin" && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="rounded-3xl p-6" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-xl font-serif font-bold">Günlük Rutin & Seri Takipçisi</h3>
                    <span className="px-3 py-1 rounded-full text-xs font-bold" style={{ background: C.ink, color: "#FFFDF9" }}>
                      ★ {completedSteps.length} Adım Tamamlandı
                    </span>
                  </div>
                  <div className="space-y-2">
                    {INITIAL_ROUTINE.Morning.map((s, idx) => {
                      const done = completedSteps.includes(s.step);
                      return (
                        <div
                          key={s.step}
                          onClick={() =>
                            setCompletedSteps((prev) =>
                              prev.includes(s.step) ? prev.filter((x) => x !== s.step) : [...prev, s.step]
                            )
                          }
                          className="cursor-pointer flex items-center gap-3 p-3 rounded-xl"
                          style={{ background: done ? "#EBF2E5" : C.bg, border: `1px solid ${C.line}` }}
                        >
                          <span className="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold" style={{ background: done ? C.accent2 : C.card, color: done ? "#fff" : C.ink }}>
                            {done ? "✓" : idx + 1}
                          </span>
                          <div className="text-xs">
                            <div className="font-bold">{s.step}</div>
                            <div style={{ color: C.muted }}>{s.note}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="rounded-3xl p-6" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                  <h3 className="text-xl font-serif font-bold mb-3">1. Gün vs 90. Gün Öncesi/Sonrası Kıyaslama</h3>
                  <input
                    type="range"
                    min="10"
                    max="90"
                    value={sliderPos}
                    onChange={(e) => setSliderPos(Number(e.target.value))}
                    className="w-full mb-2"
                  />
                  <div className="flex justify-between text-xs" style={{ color: C.muted }}>
                    <span>1. Gün (Ton Eşitsizliği: 51)</span>
                    <span>Kaydırıcı: %{sliderPos}</span>
                    <span style={{ color: C.accent2 }}>90. Gün (Ton Eşitsizliği: 33)</span>
                  </div>
                </div>
              </div>
            )}

            {/* DANIŞMAN */}
            {page === "chat" && (
              <div className="max-w-2xl mx-auto">
                <h2 className="text-2xl font-serif font-bold mb-3">AI Beauty Advisor</h2>
                <div className="rounded-3xl p-4 h-80 overflow-y-auto mb-3" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                  {chatMsgs.map((m, i) => (
                    <div key={i} className={"flex mb-3 " + (m.role === "user" ? "justify-end" : "justify-start")}>
                      <div className="max-w-md rounded-2xl px-4 py-2.5 text-xs leading-relaxed" style={{ background: m.role === "user" ? C.ink : C.bg, color: m.role === "user" ? "#FFFDF9" : C.ink }}>
                        {m.text}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2">
                  <input
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Sorunuzu yazın..."
                    className="flex-1 px-4 py-3 rounded-full text-xs outline-none"
                    style={{ background: C.card, border: `1px solid ${C.line}` }}
                  />
                  <button
                    onClick={() => {
                      if (!chatInput.trim()) return;
                      const q = chatInput;
                      setChatInput("");
                      setChatMsgs((prev) => [
                        ...prev,
                        { role: "user", text: q },
                        { role: "ai", text: "Karma cilt profiliniz için sabah Anthelios SPF 50+, akşam The Ordinary Niacinamide %10 ve Cicaplast B5+ kombinasyonunu öneririm." },
                      ]);
                    }}
                    className="px-6 rounded-full text-xs font-semibold"
                    style={{ background: C.ink, color: "#FFFDF9" }}
                  >
                    Gönder
                  </button>
                </div>
              </div>
            )}

            {/* RAPOR */}
            {page === "report" && (
              <div className="max-w-xl mx-auto rounded-2xl p-8 shadow-lg" style={{ background: "#FFF", border: `1px solid ${C.line}` }}>
                <div className="flex justify-between items-center pb-4 mb-6" style={{ borderBottom: `2px solid ${C.ink}` }}>
                  <div>
                    <div className="text-lg font-serif font-bold tracking-widest">COZMETIX</div>
                    <div className="text-xs" style={{ color: C.muted }}>Aylık AI Cilt Raporu</div>
                  </div>
                  <button onClick={() => window.print()} className="px-4 py-2 rounded-full text-xs font-semibold" style={{ background: C.ink, color: "#FFFDF9" }}>
                    ⤓ PDF İndir
                  </button>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {INITIAL_SKIN_METRICS.map((m) => (
                    <div key={m.key} className="p-3 rounded-xl text-center" style={{ background: C.bg }}>
                      <div className="text-xs" style={{ color: C.muted }}>{m.key}</div>
                      <div className="text-lg font-serif font-bold">{m.value}/100</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* COZMETIX+ */}
            {page === "premium" && (
              <div className="max-w-md mx-auto rounded-3xl p-8 text-center" style={{ background: C.ink, color: "#FFFDF9" }}>
                <div className="text-xs uppercase tracking-widest mb-2" style={{ color: C.gold }}>COZMETIX+</div>
                <h2 className="text-3xl font-serif font-bold mb-3">$9.99 / ay</h2>
                <p className="text-xs mb-6" style={{ color: "#C9C2B8" }}>
                  Sınırsız AI Analiz · INCI OCR · İçerik Uyumluluğu · Aylık PDF Raporu
                </p>
                <button
                  onClick={() => {
                    setIsPremium(!isPremium);
                    notify("✓ Cozmetix+ durumu güncellendi!");
                  }}
                  className="w-full py-3 rounded-full text-xs font-semibold"
                  style={{ background: C.accent, color: "#fff" }}
                >
                  {isPremium ? "Ücretsiz Plana Dön" : "Cozmetix+ Aktif Et"}
                </button>
              </div>
            )}

            {/* B2B API */}
            {page === "brand" && (
              <div className="max-w-3xl mx-auto rounded-3xl p-6" style={{ background: C.ink, color: "#FFFDF9" }}>
                <div className="text-xs uppercase tracking-widest mb-1" style={{ color: C.gold }}>B2B API PLAYGROUND</div>
                <h2 className="text-2xl font-serif font-bold mb-4">POST /v1/product-match</h2>
                <pre className="p-4 rounded-xl text-xs bg-black text-green-300 overflow-x-auto">
                  {JSON.stringify({ status: 200, sku: "LRP-CICA-B5", cozmetixMatchScore: 94, badge: "Excellent Match" }, null, 2)}
                </pre>
              </div>
            )}

            {/* ÜRÜN DETAY MODALI */}
            {detail && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,26,23,0.6)" }} onClick={() => setDetail(null)}>
                <div onClick={(e) => e.stopPropagation()} className="max-w-md w-full rounded-3xl p-6" style={{ background: C.card }}>
                  <div className="flex justify-between items-start mb-3">
                    <div>
                      <div className="text-xs uppercase tracking-widest" style={{ color: C.muted }}>{detail.brand}</div>
                      <h3 className="text-lg font-serif font-bold">{detail.name}</h3>
                    </div>
                    <Score score={detail.score} />
                  </div>
                  <div className="mb-4">
                    {(detail.why || []).map((w) => <div key={w} className="text-xs mb-1">✓ {w}</div>)}
                  </div>
                  <div className="grid grid-cols-3 gap-2 mb-4">
                    {Object.values(MERCHANTS).map((m) => (
                      <button
                        key={m.id}
                        onClick={() => handleMerchantClick(detail, m.id)}
                        className="py-2.5 px-2 rounded-xl text-xs font-semibold text-white"
                        style={{ background: m.badgeColor }}
                      >
                        {m.name} ↗
                      </button>
                    ))}
                  </div>
                  <button onClick={() => setDetail(null)} className="w-full py-2.5 rounded-full text-xs" style={{ border: `1px solid ${C.line}` }}>
                    Kapat
                  </button>
                </div>
              </div>
            )}
          </div>

          <footer className="px-6 py-5 text-xs text-center" style={{ borderTop: `1px solid ${C.line}`, color: C.muted }}>
            © 2026 COZMETIX · Yalnızca kozmetik öneri · Tıbbi teşhis değildir · 6698 KVKK & GDPR uyumlu
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
