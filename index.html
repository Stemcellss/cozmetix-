    async function sendRealVerificationEmail({ toEmail, toName, code }) {
      const service_id = DEFAULT_EMAILJS_CONFIG.serviceId.trim();
      const template_id = DEFAULT_EMAILJS_CONFIG.templateId.trim();
      const user_id = DEFAULT_EMAILJS_CONFIG.publicKey.trim();

      const templateParams = {
        to_email: toEmail,
        email: toEmail,
        user_email: toEmail,
        to_name: toName,
        name: toName,
        verification_code: code,
        code: code,
        title: `Doğrulama Kodunuz: ${code}`,
        message: `COZMETIX hesabınızı aktifleştirmek için 6 haneli doğrulama kodunuz: ${code}`,
      };

      try {
        if (window.emailjs) {
          await window.emailjs.send(service_id, template_id, templateParams, { publicKey: user_id });
          return { sentReal: true };
        }

        const response = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            service_id,
            template_id,
            user_id,
            template_params: templateParams,
          }),
        });

        if (response.ok) {
          return { sentReal: true };
        } else {
          const errText = await response.text();
          return { sentReal: false, reason: errText };
        }
      } catch (err) {
        return { sentReal: false, reason: err?.text || err?.message || "Bağlantı hatası" };
      }
    }

      const toggleItem = (list, setList, val) => {
        if (list.includes(val)) setList(list.filter((x) => x !== val));
        else setList([...list, val]);

      const dispatchVerificationEmail = async (targetEmail, targetName, code) => {
        setSendingEmail(true);
        const result = await sendRealVerificationEmail({
          toEmail: targetEmail,
          toName: targetName,
          code,
        });
        setSendingEmail(false);

        if (result.sentReal) {
          notify(`📧 6 haneli doğrulama kodu ${targetEmail} adresinize gönderildi! Lütfen gelen kutunuzu (veya Spam klasörünü) kontrol edin.`);
        } else {
          setErrorMsg(`⚠️ E-posta gönderilirken bir uyarı oluştu (${result.reason}). Lütfen EmailJS şablonunuzda 'To Email' alanında {{to_email}} yazdığından emin olun.`);
        }
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg("");
        const cleanEmail = email.trim().toLowerCase();

        const foundUser = registeredUsers.find((u) => u.email.toLowerCase() === cleanEmail);

        if (!foundUser) {
          setErrorMsg("❌ Bu e-posta adresiyle kayıtlı bir hesap bulunamadı! Lütfen önce 'Yeni Üye Ol' sekmesinden kayıt olun.");
          return;
        }

        if (foundUser.password !== password) {
          setErrorMsg("❌ Girdiğiniz şifre hatalı! Lütfen şifrenizi kontrol edip tekrar deneyin.");
          return;
        }

        if (!foundUser.verified) {
          setPendingEmail(foundUser.email);
          setMode("verify");
          setErrorMsg("⚠️ E-posta adresiniz henüz onaylanmamış! E-postanıza yeni bir doğrulama kodu gönderiliyor...");
          await dispatchVerificationEmail(foundUser.email, foundUser.name, foundUser.verificationCode);
          return;
        }

        setUser(foundUser);
        try { localStorage.setItem("cozmetix_active_user", JSON.stringify(foundUser)); } catch {}
        notify(`✓ Hoş geldiniz, ${foundUser.name}! Giriş başarılı.`);
        onFinish("myskin");
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg("");
        const cleanEmail = email.trim().toLowerCase();

        if (!name.trim()) {
          setErrorMsg("Lütfen adınızı ve soyadınızı girin.");
          return;
        }
        if (!cleanEmail || !cleanEmail.includes("@") || !cleanEmail.includes(".")) {
          setErrorMsg("Lütfen geçerli bir e-posta adresi girin.");
          return;
        }
        if (password.length < 6) {
          setErrorMsg("Güvenliğiniz için şifreniz en az 6 karakter olmalıdır.");
          return;
        }
        if (!kvkkAccepted) {
          setErrorMsg("Üyelik için KVKK aydınlatma metnini onaylamanız gerekmektedir.");
          return;
        }

        const existing = registeredUsers.find((u) => u.email.toLowerCase() === cleanEmail);
        if (existing) {
          if (existing.verified) {
            setErrorMsg("⚠️ Bu e-posta adresi zaten kayıtlı ve doğrulanmış. Lütfen 'Giriş Yap' sekmesini kullanın.");
            return;
          } else {
            setPendingEmail(existing.email);
            setMode("verify");
            await dispatchVerificationEmail(existing.email, existing.name, existing.verificationCode);
            return;
          }
        }

        const generatedCode = String(Math.floor(100000 + Math.random() * 900000));

        const newUnverifiedAccount = {
          id: Date.now(),
          name: name.trim(),
          email: cleanEmail,
          password: password,
          verified: false,
          verificationCode: generatedCode,
          ageRange: "25–34",
          concerns: ["Gözenek Görünümü"],
          budget: "₺500 – ₺1.000",
          createdAt: new Date().toLocaleDateString("tr-TR"),
        };

        const updatedList = [newUnverifiedAccount, ...registeredUsers];
        setRegisteredUsers(updatedList);
        try { localStorage.setItem("cozmetix_registered_users", JSON.stringify(updatedList)); } catch {}

        setPendingEmail(cleanEmail);
        setMode("verify");

        await dispatchVerificationEmail(cleanEmail, name.trim(), generatedCode);

      const handleVerifyCode = (e) => {
        e.preventDefault();
        setErrorMsg("");

        const targetUser = registeredUsers.find(
          (u) => u.email.toLowerCase() === pendingEmail.toLowerCase()
        );

        if (!targetUser) {
          setErrorMsg("Kullanıcı kaydı bulunamadı. Lütfen tekrar kayıt olun.");
          setMode("register");
          return;
        }

        if (otpInput.trim() !== targetUser.verificationCode) {
          setErrorMsg("❌ Girdiğiniz 6 haneli doğrulama kodu hatalı! Lütfen e-postanıza gelen kodu kontrol edin.");
          return;
        }

        const updatedList = registeredUsers.map((u) =>
          u.email.toLowerCase() === pendingEmail.toLowerCase()
            ? { ...u, verified: true }
            : u
        );
        setRegisteredUsers(updatedList);
        try { localStorage.setItem("cozmetix_registered_users", JSON.stringify(updatedList)); } catch {}

        notify("✓ E-posta adresiniz başarıyla doğrulandı! Şimdi cilt profilinizi tamamlayın.");
        setStep(1);
      };

      const resendCode = async () => {
        const newCode = String(Math.floor(100000 + Math.random() * 900000));
        const updatedList = registeredUsers.map((u) =>
          u.email.toLowerCase() === pendingEmail.toLowerCase()
            ? { ...u, verificationCode: newCode }
            : u
        );
        setRegisteredUsers(updatedList);

    function LiveCameraCapture({ onCapture }) {
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const [cameraActive, setCameraActive] = useState(false);
      const [cameraError, setCameraError] = useState(null);

      const startCamera = async () => {
        setCameraError(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1080 } },
            audio: false,
          });
          streamRef.current = stream;
          setCameraActive(true);
          setTimeout(() => {
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play().catch(() => {});
            }
          }, 60);
        } catch {
          setCameraError("Kamera izni kapalı. '⚡ Hızlı Demo Analiz' butonunu kullanabilirsiniz.");
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach((t) => t.stop());
          streamRef.current = null;
        }
        setCameraActive(false);
      };

      useEffect(() => () => stopCamera(), []);

      return (
        <div>
          {!cameraActive ? (
            <div>
              <div
                onClick={startCamera}
                className="cursor-pointer mx-auto w-52 h-52 rounded-full border-2 border-dashed flex flex-col items-center justify-center mb-5 transition hover:bg-black/5"
                style={{ borderColor: C.accent }}
              >
                <div className="w-20 h-28 rounded-full mb-2" style={{ background: "linear-gradient(160deg,#E7D3C3,#D9B8A5)" }} />
                <span className="text-[11px] font-medium px-4" style={{ color: C.ink }}>Canlı Kamerayı Aç</span>
              </div>
              {cameraError && (
                <div className="text-xs p-3 rounded-xl mb-4" style={{ background: "#FDECEC", color: C.accent }}>{cameraError}</div>
              )}
              <div className="grid grid-cols-2 gap-2">
                <button onClick={startCamera} className="py-3 rounded-full text-xs font-medium" style={{ background: C.ink, color: "#FFFDF9" }}>
                  📷 Kamera Aç
                </button>
                <button onClick={() => onCapture(null)} className="py-3 rounded-full text-xs font-medium" style={{ background: C.accent, color: "#fff" }}>
                  ⚡ Hızlı Demo Analiz
                </button>
              </div>
            </div>
          ) : (
            <div>
              <div className="relative mx-auto w-64 h-64 rounded-3xl overflow-hidden mb-4 shadow-lg bg-black">
                <video ref={videoRef} playsInline muted className="w-full h-full object-cover scale-x-[-1]" />
              </div>
              <div className="flex gap-2">
                <button onClick={stopCamera} className="px-4 py-3 rounded-full text-xs" style={{ border: `1px solid ${C.line}` }}>İptal</button>
                <button onClick={() => { stopCamera(); onCapture(null); }} className="flex-1 py-3 rounded-full text-sm font-medium" style={{ background: C.ink, color: "#FFFDF9" }}>
                  Fotoğrafı Çek & Analiz Et
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

                    E-posta onaylı güvenli hesabınızı oluşturun, canlı kamera ile cildinizi analiz edin ve cildinize en uygun ürünleri Trendyol, Sephora ve Amazon'da karşılaştırın.
                  </p>
                  <div className="flex flex-wrap gap-3">
                    {!user && (
                      <button onClick={() => setPage("auth")} className="px-6 py-3 rounded-full text-sm font-semibold" style={{ background: C.accent, color: "#FFFDF9" }}>
                        ✨ Hemen Üye Ol / Giriş Yap
                      </button>
                    )}
                    <button onClick={() => setPage("analyze")} className="px-6 py-3 rounded-full text-sm font-semibold" style={{ background: "#FFFDF9", color: C.ink }}>
                      📷 Cildimi Analiz Et
                    </button>
                    <button onClick={() => setPage("products")} className="px-6 py-3 rounded-full text-sm font-semibold" style={{ border: "1px solid rgba(255,255,255,0.35)", color: "#FFFDF9" }}>
                      🛍️ Ürünleri Gör
                    </button>
                  </div>
                </div>

                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {products.slice(0, 3).map((p) => (
                    <ProductCard key={p.id} p={p} onOpen={setDetail} onMerchantClick={handleMerchantClick} />
                  ))}
                </div>
              </div>
            )}

            {page === "auth" && (
              <AuthAndOnboarding
                user={user}
                setUser={setUser}
                registeredUsers={registeredUsers}
                setRegisteredUsers={setRegisteredUsers}
                onFinish={(targetPage) => setPage(targetPage)}
                notify={notify}
              />
            )}

            {page === "analyze" && (
              <div className="max-w-lg mx-auto rounded-3xl p-8 text-center" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                <h2 className="text-2xl font-serif font-bold mb-2">Canlı Kamera & Işık Kontrolü</h2>
                <LiveCameraCapture
                  onCapture={() => {
                    notify("✓ Cilt analizi tamamlandı!");
                    setPage("results");
                  }}
                />
              </div>
            )}

            {page === "results" && (
              <div className="max-w-4xl mx-auto">
                <h2 className="text-3xl font-serif font-bold text-center mb-6">Karma (Combination) Cilt Profiliniz</h2>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-8">
                  {INITIAL_SKIN_METRICS.map((m) => (
                    <Metric key={m.key} label={m.key} value={m.value} focus={m.focus} />
                  ))}
                </div>
              </div>
            )}

            {page === "myskin" && (
              <div className="max-w-3xl mx-auto rounded-3xl p-6" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                <h3 className="text-xl font-serif font-bold mb-4">Günlük Rutin & Seri Takipçisi</h3>
                <div className="space-y-2">
                  {INITIAL_ROUTINE.Morning.map((s, idx) => {
                    const done = completedSteps.includes(s.step);
                    return (
                      <div
                        key={s.step}
                        onClick={() =>
                          setCompletedSteps((prev) =>
                            prev.includes(s.step) ? prev.filter((x) => x !== s.step) : [...prev, s.step]
                          )
                        }
                        className="cursor-pointer flex items-center gap-3 p-3 rounded-xl"
                        style={{ background: done ? "#EBF2E5" : C.bg, border: `1px solid ${C.line}` }}
                      >
                        <span className="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold" style={{ background: done ? C.accent2 : C.card, color: done ? "#fff" : C.ink }}>
                          {done ? "✓" : idx + 1}
                        </span>
                        <div className="text-xs">
                          <div className="font-bold">{s.step}</div>
                          <div style={{ color: C.muted }}>{s.note}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {page === "products" && (
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {products.map((p) => (
                  <ProductCard key={p.id} p={p} onOpen={setDetail} onMerchantClick={handleMerchantClick} />
                ))}
              </div>
            )}

            {page === "admin" && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="rounded-3xl p-6" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                  <div className="text-[10px] uppercase tracking-widest font-bold mb-1" style={{ color: C.accent2 }}>
                    ✓ EMAILJS BAĞLANTISI AKTİF (service_sw0apbl)
                  </div>
                  <h3 className="text-xl font-serif font-bold mb-2">Kayıtlı Üyeler ({registeredUsers.length})</h3>
                  {registeredUsers.length === 0 ? (
                    <p className="text-xs" style={{ color: C.muted }}>Henüz kayıtlı üye yok.</p>
                  ) : (
                    registeredUsers.map((u) => (
                      <div key={u.id} className="flex justify-between items-center text-xs p-3 mb-2 rounded-xl" style={{ background: C.bg }}>
                        <span><strong>{u.name}</strong> ({u.email})</span>
                        <span
                          className="px-2.5 py-1 rounded-full text-[10px] font-bold text-white"
                          style={{ background: u.verified ? C.accent2 : C.accent }}
                        >
                          {u.verified ? "✓ Doğrulandı" : "⏳ Onay Bekliyor"}
                        </span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {detail && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,26,23,0.6)" }} onClick={() => setDetail(null)}>
                <div onClick={(e) => e.stopPropagation()} className="max-w-md w-full rounded-3xl p-6" style={{ background: C.card }}>
                  <h3 className="text-lg font-serif font-bold mb-2">{detail.brand} — {detail.name}</h3>
                  <div className="grid grid-cols-3 gap-2 my-4">
                    {Object.values(MERCHANTS).map((m) => (
                      <button
                        key={m.id}
                        onClick={() => handleMerchantClick(detail, m.id)}
                        className="py-2.5 px-2 rounded-xl text-xs font-semibold text-white"
                        style={{ background: m.badgeColor }}
                      >
                        {m.name} ↗
                      </button>
                    ))}
                  </div>
                  <button onClick={() => setDetail(null)} className="w-full py-2.5 rounded-full text-xs" style={{ border: `1px solid ${C.line}` }}>
                    Kapat
                  </button>
                </div>
              </div>
            )}
          </div>

          <footer className="px-6 py-5 text-xs text-center" style={{ borderTop: `1px solid ${C.line}`, color: C.muted }}>
            © 2026 COZMETIX · Yalnızca kozmetik öneri · Tıbbi teşhis değildir · 6698 KVKK & GDPR uyumlu
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
