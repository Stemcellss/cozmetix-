    const INITIAL_ROUTINE = {
      Morning: [
        { step: "Temizleyici (Cleanser)", note: "T-bölgesini kurutmayan düşük pH yüz yıkama jeli.", freq: "Her gün" },
        { step: "Nem / C Vitamini Serumu", note: "Daha aydınlık ve nemli cilt görünümü sağlar.", freq: "Her gün" },

      Evening: [
        { step: "Çift Aşamalı Temizleyici", note: "Güneş kremi ve makyaj kalıntılarını arındırır.", freq: "Her gün" },
        { step: "Niacinamide %10 Serum", note: "Gözenek ve ton eşitsizliği görünümünü hedefler.", freq: "Her gün" },
        { step: "Retinol / BHA Gece Bakımı", note: "Doku yenileyici bakım (Haftada 2–3 gece).", freq: "Haftada 2–3" },
        { step: "Cicaplast / Seramid Kremi", note: "Gece boyu cilt bariyerini onarır ve nemi kilitler.", freq: "Her gün" },
      ],
    };

    function Score({ score }) {
      const color = score >= 90 ? C.accent2 : score >= 85 ? C.gold : C.muted;
      return (
        <div className="flex items-center gap-1.5 shrink-0">
          <svg width="42" height="42" viewBox="0 0 44 44">
            <circle cx="22" cy="22" r="18" fill="none" stroke={C.line} strokeWidth="4" />
            <circle
              cx="22" cy="22" r="18" fill="none" stroke={color} strokeWidth="4"
              strokeDasharray={`${(score / 100) * 113} 113`} strokeLinecap="round"
              transform="rotate(-90 22 22)"
            />
            <text x="22" y="26" textAnchor="middle" fontSize="12" fontWeight="700" fill={C.ink}>{score}%</text>
          </svg>
        </div>
      );
    }

    function Metric({ label, value, focus }) {
      return (
        <div className="rounded-2xl p-4" style={{ background: C.card, border: `1px solid ${C.line}` }}>
          <div className="flex justify-between items-baseline mb-2">
            <span className="text-sm font-medium">{label}</span>
            <span className="text-xs" style={{ color: C.muted }}>{value}/100</span>
          </div>
          <div className="h-2 rounded-full overflow-hidden" style={{ background: C.line }}>
            <div className="h-full rounded-full transition-all duration-700" style={{ width: `${value}%`, background: focus ? C.accent : C.gold }} />
          </div>
          {focus && <div className="mt-2 text-[10px] uppercase tracking-widest" style={{ color: C.accent }}>Odak Alanı</div>}
        </div>
      );
    }

    function ProductCard({ p, onOpen, onMerchantClick }) {
      return (
        <div
          className="rounded-2xl overflow-hidden transition hover:-translate-y-0.5 hover:shadow-lg flex flex-col justify-between"
          style={{ background: C.card, border: `1px solid ${C.line}` }}
        >
          <div onClick={() => onOpen(p)} className="cursor-pointer">
            <div className="h-36 flex items-center justify-center relative overflow-hidden" style={{ background: `linear-gradient(135deg, ${C.bg}, #EFE7DE)` }}>
              {p.image ? (
                <img src={p.image} alt={p.name} className="w-full h-full object-contain p-3 bg-white" />
              ) : (
                <div className="w-16 h-24 rounded-xl flex items-end justify-center pb-2 shadow-md px-1" style={{ background: "#E4E0D7", border: "1px solid rgba(0,0,0,0.08)" }}>
                  <span className="text-[8px] tracking-widest font-bold truncate" style={{ color: C.ink }}>{p.brand}</span>
                </div>
              )}
              {p.sponsored && (
                <span className="absolute top-2 right-2 text-[10px] px-2.5 py-0.5 rounded-full font-semibold" style={{ background: C.gold, color: "#fff" }}>
                  Öne Çıkan
                </span>
              )}
            </div>
            <div className="p-4 pb-2">
              <div className="flex justify-between items-start gap-2">
                <div>
                  <div className="text-[10px] uppercase tracking-widest font-semibold" style={{ color: C.muted }}>{p.brand}</div>
                  <div className="font-medium leading-snug text-sm mt-0.5">{p.name}</div>
                </div>
                <Score score={p.score} />
              </div>
              <div className="mt-2.5 flex justify-between items-center">
                <span className="text-xs px-2.5 py-0.5 rounded-full" style={{ background: C.bg, color: C.muted }}>{p.category}</span>
                <span className="font-bold text-sm" style={{ color: C.ink }}>₺{p.price}</span>
              </div>
            </div>
          </div>

          <div className="px-4 pb-4 pt-2" style={{ borderTop: `1px solid ${C.line}` }}>
            <div className="text-[9px] uppercase tracking-wider mb-1.5" style={{ color: C.muted }}>
              Mağazada Gör & Satın Al:
            </div>
            <div className="grid grid-cols-3 gap-1.5">

                <button
                  key={m.id}
                  onClick={(e) => {
                    e.stopPropagation();
                    onMerchantClick(p, m.id);
                  }}
                  className="py-1.5 px-1 rounded-lg text-[10px] font-semibold flex items-center justify-center gap-1 transition hover:opacity-85"
                  style={{ background: m.badgeColor, color: "#FFFFFF" }}

    // ============================================================
    // ÜYE OL & GİRİŞ YAP + 4 ADIMLI CİLT PROFİLİ ANKETİ MODÜLÜ
    // ============================================================
    function AuthAndOnboarding({ user, setUser, onFinish, notify }) {
      const [mode, setMode] = useState("register"); // "register" | "login"
      const [step, setStep] = useState(0); // 0: Hesap Bilgileri, 1: Yaş, 2: Cilt Endişeleri, 3: Bütçe & Hedef
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [kvkkAccepted, setKvkkAccepted] = useState(true);

      const [ageRange, setAgeRange] = useState("25–34");
      const [concerns, setConcerns] = useState(["Gözenek Görünümü", "Ton Eşitsizliği"]);
      const [budget, setBudget] = useState("₺500 – ₺1.000");
      const [goals, setGoals] = useState(["Nemlendirme & Bariyer", "Aydınlık Görünüm"]);

      const toggleItem = (list, setList, val) => {
        if (list.includes(val)) {
          setList(list.filter((x) => x !== val));
        } else {
          setList([...list, val]);
        }
      };

      const handleAccountStep = (e) => {
        e.preventDefault();
        if (!email.trim() || ! email.includes("@")) {
          notify("Lütfen geçerli bir e-posta adresi girin.");
          return;
        }
        if (password.length < 4) {
          notify("Lütfen en az 4 karakterli bir şifre belirleyin.");
          return;
        }
        if (mode === "login") {
          const loggedUser = {
            name: name.trim() || email.split("@")[0],
            email: email.trim(),
            ageRange,
            concerns,
            budget,
          };
          setUser(loggedUser);
          try { localStorage.setItem("cozmetix_user", JSON.stringify(loggedUser)); } catch {}
          notify(`Tekrar hoş geldiniz, ${loggedUser.name}!`);
          onFinish("myskin");
          return;
        }
        if (!kvkkAccepted) {
          notify("Devam etmek için KVKK aydınlatma metnini onaylayın.");
          return;
        }
        // Kayıt modunda 2. adıma (Cilt Anketine) geç
        setStep(1);
      };

      const completeRegistration = () => {
        const newUser = {
          name: name.trim() || email.split("@")[0],
          email: email.trim(),
          ageRange,
          concerns,
          budget,
          goals,
          createdAt: new Date().toLocaleDateString("tr-TR"),
        };
        setUser(newUser);
        try { localStorage.setItem("cozmetix_user", JSON.stringify(newUser)); } catch {}
        notify(`🎉 Hoş geldiniz ${newUser.name}! Üyeliğiniz ve cilt profiliniz oluşturuldu.`);
        onFinish("analyze");
      };

      // Eğer kullanıcı zaten giriş yapmışsa Profil Kartını göster
      if (user) {
        return (
          <div className="max-w-lg mx-auto rounded-3xl p-8" style={{ background: C.card, border: `1px solid ${C.line}` }}>
            <div className="flex items-center justify-between mb-6 pb-4" style={{ borderBottom: `1px solid ${C.line}` }}>
              <div>
                <div className="text-[10px] uppercase tracking-widest font-semibold" style={{ color: C.accent }}>
                  AKTİF ÜYE PROFİLİ
                </div>
                <h2 className="text-2xl font-serif font-bold mt-0.5">{user.name}</h2>
                <div className="text-xs" style={{ color: C.muted }}>{user.email}</div>
              </div>
              <div className="w-12 h-12 rounded-full flex items-center justify-center text-lg font-serif font-bold" style={{ background: C.ink, color: "#FFFDF9" }}>
                {(user.name || "U")[0].toUpperCase()}
              </div>
            </div>

            <div className="space-y-3 text-xs mb-6">
              <div className="flex justify-between p-3 rounded-xl" style={{ background: C.bg }}>
                <span style={{ color: C.muted }}>Yaş Aralığı:</span>
                <strong>{user.ageRange || "25–34"}</strong>
              </div>
              <div className="flex justify-between p-3 rounded-xl" style={{ background: C.bg }}>
                <span style={{ color: C.muted }}>Aylık Bakım Bütçesi:</span>
                <strong>{user.budget || "₺500 – ₺1.000"}</strong>
              </div>
              <div className="p-3 rounded-xl" style={{ background: C.bg }}>
                <div className="mb-1.5" style={{ color: C.muted }}>Cilt Odak Alanlarınız:</div>
                <div className="flex flex-wrap gap-1.5">
                  {(user.concerns || ["Gözenek Görünümü"]).map((c) => (
                    <span key={c} className="px-2.5 py-1 rounded-full text-[11px] font-medium" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                      {c}
                    </span>
                  ))}
                </div>
              </div>
            </div>

            <div className="flex gap-3">
              <button
                onClick={() => onFinish("analyze")}
                className="flex-1 py-3 rounded-full text-xs font-semibold"
                style={{ background: C.ink, color: "#FFFDF9" }}
              >
                📷 Cilt Analizine Git
              </button>
              <button
                onClick={() => {
                  setUser(null);
                  try { localStorage.removeItem("cozmetix_user"); } catch {}
                  notify("Hesabınızdan çıkış yapıldı.");
                }}
                className="px-5 py-3 rounded-full text-xs font-semibold"
                style={{ border: `1px solid ${C.line}`, color: C.accent }}
              >
                Çıkış Yap
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-lg mx-auto">
          {/* Adım Çubuğu */}
          {mode === "register" && (
            <div className="flex gap-1.5 mb-5">
              {[0, 1, 2, 3].map((i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition-all"
                  style={{ background: i <= step ? C.accent : C.line }}
                />
              ))}
            </div>
          )}

          <div className="rounded-3xl p-7 md:p-8 shadow-sm" style={{ background: C.card, border: `1px solid ${C.line}` }}>
            {/* Üye Ol / Giriş Yap Sekme Seçici */}
            {step === 0 && (
              <div className="flex rounded-full p-1 mb-6" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
                <button
                  type="button"
                  onClick={() => setMode("register")}
                  className="flex-1 py-2 rounded-full text-xs font-semibold transition"
                  style={{
                    background: mode === "register" ? C.ink : "transparent",
                    color: mode === "register" ? "#FFFDF9" : C.muted,
                  }}
                >
                  ✨ Yeni Üye Ol
                </button>
                <button
                  type="button"
                  onClick={() => setMode("login")}
                  className="flex-1 py-2 rounded-full text-xs font-semibold transition"
                  style={{
                    background: mode === "login" ? C.ink : "transparent",
                    color: mode === "login" ? "#FFFDF9" : C.muted,
                  }}
                >
                  🔑 Giriş Yap
                </button>
              </div>
            )}

            {/* ADIM 0: HESAP OLUŞTURMA VEYA GİRİŞ */}
            {step === 0 && (
              <form onSubmit={handleAccountStep} className="space-y-4">
                <div>
                  <h2 className="text-2xl font-serif font-bold">
                    {mode === "register" ? "Kişisel Cilt Hesabınızı Oluşturun" : "Cozmetix Hesabınıza Giriş Yapın"}
                  </h2>
                  <p className="text-xs mt-1" style={{ color: C.muted }}>
                    {mode === "register"
                      ? "Cilt analizlerinizi, günlük rutin serinizi ve ürün uyum skorlarınızı kaydetmek için ücretsiz üye olun."
                      : "Kayıtlı cilt profilinize ve rutin takibinize kaldığınız yerden devam edin."}
                  </p>
                </div>

                {mode === "register" && (
                  <div>
                    <label className="text-xs font-medium block mb-1">Adınız Soyadınız</label>
                    <input
                      type="text"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Örn: Selin Yılmaz"
                      className="w-full px-4 py-3 rounded-xl text-sm outline-none"
                      style={{ background: C.bg, border: `1px solid ${C.line}` }}
                    />
                  </div>
                )}

                <div>
                  <label className="text-xs font-medium block mb-1">E-posta Adresiniz *</label>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}

    function LiveCameraCapture({ onCapture }) {
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const [cameraActive, setCameraActive] = useState(false);
      const [cameraError, setCameraError] = useState(null);

      const startCamera = async () => {
        setCameraError(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1080 } },
            audio: false,
          });
          streamRef.current = stream;
          setCameraActive(true);
          setTimeout(() => {
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play().catch(() => {});
            }
          }, 60);
        } catch {
          setCameraError("Kamera izni kapalı. '⚡ Hızlı Demo Analiz' butonunu kullanabilirsiniz.");
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach((t) => t.stop());
          streamRef.current = null;
        }
        setCameraActive(false);
      };

      useEffect(() => () => stopCamera(), []);

      return (
        <div>
          {!cameraActive ? (
            <div>
              <div
                onClick={startCamera}
                className="cursor-pointer mx-auto w-52 h-52 rounded-full border-2 border-dashed flex flex-col items-center justify-center mb-5 transition hover:bg-black/5"
                style={{ borderColor: C.accent }}
              >
                <div className="w-20 h-28 rounded-full mb-2" style={{ background: "linear-gradient(160deg,#E7D3C3,#D9B8A5)" }} />
                <span className="text-[11px] font-medium px-4" style={{ color: C.ink }}>Canlı Kamerayı Aç</span>
              </div>
              {cameraError && (
                <div className="text-xs p-3 rounded-xl mb-4" style={{ background: "#FDECEC", color: C.accent }}>{cameraError}</div>
              )}
              <div className="grid grid-cols-2 gap-2">
                <button onClick={startCamera} className="py-3 rounded-full text-xs font-medium" style={{ background: C.ink, color: "#FFFDF9" }}>
                  📷 Kamera Aç
                </button>
                <button onClick={() => onCapture(null)} className="py-3 rounded-full text-xs font-medium" style={{ background: C.accent, color: "#fff" }}>
                  ⚡ Hızlı Demo Analiz
                </button>
              </div>
            </div>
          ) : (
            <div>
              <div className="relative mx-auto w-64 h-64 rounded-3xl overflow-hidden mb-4 shadow-lg bg-black">
                <video ref={videoRef} playsInline muted className="w-full h-full object-cover scale-x-[-1]" />
              </div>
              <div className="flex gap-2">
                <button onClick={stopCamera} className="px-4 py-3 rounded-full text-xs" style={{ border: `1px solid ${C.line}` }}>İptal</button>
                <button onClick={() => { stopCamera(); onCapture(null); }} className="flex-1 py-3 rounded-full text-sm font-medium" style={{ background: C.ink, color: "#FFFDF9" }}>
                  Fotoğrafı Çek & Analiz Et
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

                </div>

                <div className="rounded-3xl p-6" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                  <h3 className="text-xl font-serif font-bold mb-3">İçerik Çakışma Denetleyicisi</h3>
                  <div className="grid sm:grid-cols-2 gap-3 mb-3">
                    <select value={compA} onChange={(e) => setCompA(Number(e.target.value))} className="p-2.5 rounded-xl text-xs" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
                      {products.map((p) => <option key={p.id} value={p.id}>{p.brand} — {p.name}</option>)}
                    </select>
                    <select value={compB} onChange={(e) => setCompB(Number(e.target.value))} className="p-2.5 rounded-xl text-xs" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
                      {products.map((p) => <option key={p.id} value={p.id}>{p.brand} — {p.name}</option>)}
                    </select>
                  </div>
                  <div className="p-3.5 rounded-xl text-xs" style={{ background: C.bg }}>
                    <strong style={{ color: isConflict ? C.accent : C.accent2 }}>
                      {isConflict ? "✕ Çakışma Uyarısı: " : "✓ Güvenli Sinerji: "}
                    </strong>
                    {isConflict
                      ? "Aynı akşam üst üste uygulamayın; farklı gecelerde dönüşümlü kullanın."
                      : "Aynı rutinde güvenle birlikte uygulanabilir."}
                  </div>
                </div>

                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {products.map((p) => (
                    <ProductCard key={p.id} p={p} onOpen={setDetail} onMerchantClick={handleMerchantClick} />
                  ))}
                </div>
              </div>
            )}

            {/* DANIŞMAN */}
            {page === "chat" && (
              <div className="max-w-2xl mx-auto">
                <h2 className="text-2xl font-serif font-bold mb-3">AI Güzellik Danışmanı</h2>
                <div className="rounded-3xl p-4 h-80 overflow-y-auto mb-3" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                  {chatMsgs.map((m, i) => (
                    <div key={i} className={"flex mb-3 " + (m.role === "user" ? "justify-end" : "justify-start")}>
                      <div className="max-w-md rounded-2xl px-4 py-2.5 text-xs leading-relaxed" style={{ background: m.role === "user" ? C.ink : C.bg, color: m.role === "user" ? "#FFFDF9" : C.ink }}>
                        {m.text}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2">
                  <input
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Sorunuzu yazın..."
                    className="flex-1 px-4 py-3 rounded-full text-xs outline-none"
                    style={{ background: C.card, border: `1px solid ${C.line}` }}
                  />
                  <button
                    onClick={() => {
                      if (!chatInput.trim()) return;
                      const q = chatInput;
                      setChatInput("");
                      setChatMsgs((prev) => [
                        ...prev,
                        { role: "user", text: q },
                        { role: "ai", text: "Karma cilt profiliniz için sabah Anthelios SPF 50+, akşam The Ordinary Niacinamide %10 ve Cicaplast B5+ kombinasyonunu öneririm." },
                      ]);
                    }}
                    className="px-6 rounded-full text-xs font-semibold"
                    style={{ background: C.ink, color: "#FFFDF9" }}
                  >
                    Gönder
                  </button>
                </div>
              </div>
            )}

            {/* RAPOR */}
            {page === "report" && (
              <div className="max-w-xl mx-auto rounded-2xl p-8 shadow-lg" style={{ background: "#FFF", border: `1px solid ${C.line}` }}>
                <div className="flex justify-between items-center pb-4 mb-6" style={{ borderBottom: `2px solid ${C.ink}` }}>
                  <div>
                    <div className="text-lg font-serif font-bold tracking-widest">COZMETIX</div>
                    <div className="text-xs" style={{ color: C.muted }}>Aylık AI Cilt Raporu {user ? `· ${user.name}` : ""}</div>
                  </div>
                  <button onClick={() => window.print()} className="px-4 py-2 rounded-full text-xs font-semibold" style={{ background: C.ink, color: "#FFFDF9" }}>
                    ⤓ PDF İndir
                  </button>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {INITIAL_SKIN_METRICS.map((m) => (
                    <div key={m.key} className="p-3 rounded-xl text-center" style={{ background: C.bg }}>
                      <div className="text-xs" style={{ color: C.muted }}>{m.key}</div>
                      <div className="text-lg font-serif font-bold">{m.value}/100</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* COZMETIX+ */}
            {page === "premium" && (
              <div className="max-w-md mx-auto rounded-3xl p-8 text-center" style={{ background: C.ink, color: "#FFFDF9" }}>
                <div className="text-xs uppercase tracking-widest mb-2" style={{ color: C.gold }}>COZMETIX+</div>
                <h2 className="text-3xl font-serif font-bold mb-3">₺199 / ay</h2>
                <p className="text-xs mb-6" style={{ color: "#C9C2B8" }}>
                  Sınırsız AI Analiz · INCI OCR · İçerik Uyumluluğu · Aylık PDF Raporu
                </p>
                <button
                  onClick={() => {
                    setIsPremium(!isPremium);
                    notify("✓ Cozmetix+ durumu güncellendi!");
                  }}
                  className="w-full py-3 rounded-full text-xs font-semibold"
                  style={{ background: C.accent, color: "#fff" }}
                >
                  {isPremium ? "Ücretsiz Plana Dön" : "Cozmetix+ Aktif Et"}
                </button>
              </div>
            )}

            {/* ADMIN */}
            {page === "admin" && (
              <div className="max-w-3xl mx-auto rounded-3xl p-6" style={{ background: C.card, border: `1px solid ${C.line}` }}>
                <h2 className="text-2xl font-serif font-bold mb-4">Yönetim & Affiliate Komisyon Takibi</h2>
                <div className="rounded-2xl p-4 mb-4 flex justify-between items-center" style={{ background: C.ink, color: "#FFFDF9" }}>
                  <span>Toplam Tahmini Komisyon:</span>
                  <strong className="text-xl font-serif" style={{ color: "#A8E6CF" }}>₺{totalCommission}</strong>
                </div>
                <div className="space-y-2">
                  {affiliateClicks.map((c) => (
                    <div key={c.id} className="flex justify-between text-xs p-3 rounded-xl" style={{ background: C.bg }}>
                      <span><strong>{c.merchant}</strong> · {c.brand} — {c.name}</span>
                      <strong style={{ color: C.accent2 }}>+₺{c.commission}</strong>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ÜRÜN DETAY MODALI */}
            {detail && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,26,23,0.6)" }} onClick={() => setDetail(null)}>
                <div onClick={(e) => e.stopPropagation()} className="max-w-md w-full rounded-3xl p-6" style={{ background: C.card }}>
                  <div className="flex justify-between items-start mb-3">
                    <div>
                      <div className="text-xs uppercase tracking-widest" style={{ color: C.muted }}>{detail.brand}</div>
                      <h3 className="text-lg font-serif font-bold">{detail.name}</h3>
                    </div>
                    <Score score={detail.score} />
                  </div>
                  <div className="mb-4">
                    {(detail.why || []).map((w) => <div key={w} className="text-xs mb-1">✓ {w}</div>)}
                  </div>
                  <div className="grid grid-cols-3 gap-2 mb-4">
                    {Object.values(MERCHANTS).map((m) => (
                      <button
                        key={m.id}
                        onClick={() => handleMerchantClick(detail, m.id)}
                        className="py-2.5 px-2 rounded-xl text-xs font-semibold text-white"
                        style={{ background: m.badgeColor }}
                      >
                        {m.name} ↗
                      </button>
                    ))}
                  </div>
                  <button onClick={() => setDetail(null)} className="w-full py-2.5 rounded-full text-xs" style={{ border: `1px solid ${C.line}` }}>
                    Kapat
                  </button>
                </div>
              </div>
            )}
          </div>

          <footer className="px-6 py-5 text-xs text-center" style={{ borderTop: `1px solid ${C.line}`, color: C.muted }}>
            © 2026 COZMETIX · Yalnızca kozmetik öneri · Tıbbi teşhis değildir · 6698 KVKK & GDPR uyumlu
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
